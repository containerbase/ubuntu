name: build

on:
  push:
    branches:
      - main

  pull_request:
  merge_group:

  schedule:
    - cron: '0 2 * * *'

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-slim
    timeout-minutes: 10
    permissions:
      contents: read
      checks: write # shellcheck annotations
    env:
      # node and pnpm come from the setup action, so `mise exec` must not
      # install them again
      MISE_EXEC_AUTO_INSTALL: 'false'

    steps:
      - name: ⚙️ Setup
        uses: containerbase/internal-tools/setup@59f82735f639df5ecc8febc4ae9d10ed8ea03c7a # v5.3.15
        with:
          save-cache: true

      - name: lint
        run: pnpm oxfmt

      - name: Install the workflow linters
        uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          install_args: jactionlint shellcheck zizmor

      - name: Check workflow files
        run: mise exec -- jactionlint --color

      - name: Run zizmor
        run: mise exec -- zizmor --format github .github/
        env:
          GH_TOKEN: ${{ github.token }}

      - name: shellcheck
        if: ${{ github.event_name != 'merge_group' }}
        uses: reviewdog/action-shellcheck@d0b8d5fd7fad6afdb6e1b6ce1778892be4d1f427 # v1.34.1
        with:
          fail_level: any
          reporter: github-pr-annotations
          filter_mode: nofilter
          path: |
            .husky
          pattern: |
            *.sh
          exclude: |
            ./.git/*
            ./.husky/_/*
          check_all_files_with_shebangs: 'true'

  build:
    needs:
      - lint
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    permissions:
      id-token: write # cosign keyless signing
      packages: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          show-progress: false
          persist-credentials: false

      - uses: fluxcd/flux-mirror/actions/setup@aa0a195f33accc11150b155e086688fb2c810122 # v0.14.0
        with:
          version: v0.14.0 # renovate: datasource=github-releases depName=flux-mirror packageName=fluxcd/flux-mirror

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sync oci references
        shell: bash
        run: |
          flux-mirror sync flux-mirror/ubuntu.yml ${{ github.ref_name != 'main' && '--dry-run' || '' }} --no-progress ${{ runner.debug == '1' && '--verbose' || '' }} -o json | tee report.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker registry login
        if: github.ref_name == 'main'
        run: echo "${GH_TOKEN}" | docker login ghcr.io -u "${GITHUB_REPOSITORY_OWNER}" --password-stdin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sign new digests
        if: github.ref_name == 'main'
        shell: bash
        run: |
          jq -r '[.report.results[].tags[] | select(.status == "copied" or .status == "overwritten") | .digest] | unique[]' report.json |
            while read -r digest; do
              cosign sign -y "ghcr.io/${GITHUB_REPOSITORY}@${digest}"
            done

  success:
    runs-on: ubuntu-26.04
    needs:
      - lint
      - build
    timeout-minutes: 1
    if: always()
    steps:
      - name: Fail for failed or cancelled build
        if: |
          needs.build.result == 'failure' ||
          needs.build.result == 'cancelled'
        run: exit 1
      - name: Fail for failed or cancelled lint
        if: |
          needs.lint.result == 'failure' ||
          needs.lint.result == 'cancelled'
        run: exit 1
